# pdf-triage's Docker services.
#
#   docker compose up -d --build
#
# PDF/photo text extraction is delegated to the self-hosted, external markdown-extract-service
# (pdf2w), which runs from its own repository and compose file and is reached through
# PDF2W_SERVICE_URL. It is intentionally not defined here. The old in-repo `pdf-extract`
# microservice (Dockerfile.extract-service, src/extract-service/) has been removed.
#
# The single service defined here is the Go canonical-path service built from the
# services/pdf-triage-pdf2w git submodule. The main app requires it
# (CANONICAL_PATH_SERVICE_URL) with no fallback.
#
# See docs/superpowers/specs/2026-09-17-pdf2w-extraction-swap-design.md.

services:
  # Go canonical-path service (services/pdf-triage-pdf2w submodule) — see
  # docs/superpowers/specs/2026-09-17-pdf2w-extraction-swap-design.md. Required by the main app
  # (CANONICAL_PATH_SERVICE_URL), no optional fallback.
  pdf-triage-pdf2w:
    build:
      context: ./services/pdf-triage-pdf2w
    image: pdf-triage/pdf-triage-pdf2w:latest
    container_name: pdf-triage-pdf2w
    restart: unless-stopped
    ports:
      - "3985:3985"
    environment:
      PORT: "3985"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3985/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
