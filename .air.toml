root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["serve"]
  bin = "./tmp/pdf-triage"
  cmd = "go build -C services/pdf-triage-pdf2w -trimpath -o ../../tmp/pdf-triage ./cmd/pdf-triage"
  delay = 500
  entrypoint = ["./tmp/pdf-triage"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "dist", "node_modules", ".git", "public/js"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = ["services/pdf-triage-pdf2w"]
  include_ext = ["go"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = true
  poll_interval = 500
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true
